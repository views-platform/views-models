name: Run Tests
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PINNED, and the pin is the point. This was `pip install views_pipeline_core pytest`,
      # unpinned, so CI silently tested against whatever PyPI served that day: no past green
      # run recorded which version it had actually proved.
      #
      # 3.3.0 (published 2026-09-19). 3.2.0 was the first release a config_maturity.py source
      # runs on (pipeline-core #495, #497; why PR #444 broke 14 models while this suite, then
      # on 3.0.1, stayed green). 3.3.0 adds: the queryset loader raises with an install hint
      # instead of returning None (their #514 -- tools/catalogs/update_readme.py isolates that
      # call, #478); ADR-064 refuses a DataFrame prediction carrying an entity absent from the
      # input's last month; wandb <1.0 and views-frames <3, so this venv resolves wandb 0.30
      # and views-frames 2.0.0 -- the same resolution the ensembles get, since they pin
      # neither. The ensembles declare >=3.0.0,<4.0.0, so 3.3.0 is inside what production
      # installs.
      #
      # Bump this deliberately, together with the ensembles' requirements.txt floors, never
      # on its own -- CI testing a version production does not install is the skew this pin
      # removes. Named trigger for the NEXT bump: at 4.0 viewser becomes an optional extra
      # (their ADR-063); anything here that reaches viewser through pipeline-core without
      # installing the extra stops importing.
      - name: Install dependencies
        run: pip install "views_pipeline_core==3.3.0" pytest packaging

      - name: Run tests
        run: pytest
