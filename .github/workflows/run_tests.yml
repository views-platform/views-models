name: Run Tests
on:
  push:
    branches: [main, development]
  pull_request:
    branches: [main, development]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # PINNED, and the pin is the point. This was `pip install views_pipeline_core pytest`,
      # unpinned, so CI silently tested against whatever PyPI served that day: no past green
      # run recorded which version it had actually proved.
      #
      # 3.0.0 was published 2026-08-03T02:06Z. It is what this repo's ensembles now declare,
      # and it is what makes the declaration TRUE -- `domain.reconciliation_port` (which
      # skinny_love imports at module level) and `templates.ensemble.template_config_modelset`
      # both exist in it, and it pulls views-frames>=1.10.2 transitively.
      #
      # Bump this deliberately, together with the ensembles' requirements.txt, never on its
      # own -- CI testing a version production does not install is the skew this pin removes.
      - name: Install dependencies
        run: pip install "views_pipeline_core==3.0.0" pytest packaging

      - name: Run tests
        run: pytest
